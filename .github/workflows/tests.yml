name: tests
on:
  push:
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run unittest suite
        run: python -m unittest discover -s .agents/skills/academic-terminology-zh/tests -v
      - name: Compile scripts
        run: |
          python -m py_compile .agents/skills/academic-terminology-zh/scripts/lookup.py
          python -m py_compile .agents/skills/academic-terminology-zh/scripts/import_terms.py

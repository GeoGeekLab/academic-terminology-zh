name: tests
on:
  push:
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run unittest suite
        run: python -m unittest discover -s .agents/skills/academic-terminology-zh/tests -v
      - name: Verify bundled terminology indexes
        run: |
          python .agents/skills/academic-terminology-zh/scripts/lookup.py --stats --json > /tmp/term_counts.json
          python -c "import json; counts=json.load(open('/tmp/term_counts.json',encoding='utf-8'))['counts']; assert counts=={'oceanography':1175,'artificial_intelligence':75,'remote_sensing':594,'statistics':216}, counts"
      - name: Compile scripts
        run: |
          python -m py_compile .agents/skills/academic-terminology-zh/scripts/lookup.py
          python -m py_compile .agents/skills/academic-terminology-zh/scripts/import_terms.py

      - name: Validate licensed research benchmark
        run: python evals/benchmark.py validate
      - name: Run benchmark and installer unit tests
        run: |
          python -m unittest discover -s evals -v
          python -m unittest discover -s integrations -v
      - name: Compile integration scripts
        run: |
          python -m py_compile evals/benchmark.py integrations/install.py .agents/skills/academic-terminology-zh/scripts/handoff.py
      - name: Audit standards source inventory and release rights
        run: python scripts/audit_rights.py
